<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎉 Lottery Winner!</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #5b2cff, #00c6ff);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: white;
      text-align: center;
    }

    .box {
      background: white;
      color: #222;
      width: 90%;
      max-width: 430px;
      padding: 35px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }

    .emoji {
      font-size: 55px;
    }

    h1 {
      color: #6c2cff;
    }

    .money {
      font-size: 38px;
      font-weight: bold;
      color: #0aa34f;
      margin: 20px 0;
    }

    button {
      border: 0;
      background: #6c2cff;
      color: white;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    #prank {
      display: none;
    }
  </style>
</head>

<body>

  <div class="box" id="winner">
    <div class="emoji">🎉💰🎉</div>

    <h1>অভিনন্দন!</h1>

    <p>আপনি একটি বিশেষ লটারি পুরস্কার জিতেছেন!</p>

    <div class="money">৳ ৫,০০,০০০</div>

    <p>আপনার ভাগ্য আজ সত্যিই অসাধারণ! 😱</p>

    <button onclick="showPrank()">পুরস্কার দেখুন 🎁</button>
  </div>

  <div class="box" id="prank">
    <div class="emoji">⚠️</div>

    <h1>your device is hacked ⚠️</h1>

    <p>you are in trouble⚠️!</p>

    <p><b> যদি নিরাপদ থাকতে চাছ তাইলে! </b></p>

    <p>বাসায় আই 1crore দি যা 😝😝</p>
  </div>

  <script>
    function showPrank() {
      document.getElementById("winner").style.display = "none";
      document.getElementById("prank").style.display = "block";
    }
  </script>

</body>
</html>
